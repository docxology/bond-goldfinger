# Domain profile — goldfinger (GRAND SLAM)

# Advisory declarative metadata for agentic-research controls. Validation
# inputs only; does not execute autonomous agents.

domain: "Special-agent mission modelling for Goldfinger (1964)"

mission:
  codename: "GRAND SLAM"
  provider_module: "goldfinger.mission"
  protocol: "bond_api.MissionProvider"

review_gates:
  determinism_gate: "fixed seed 2026, no untracked RNG, no wall-clock in persisted results"
  coverage_gate: "at least 90 percent line and branch on src/goldfinger"
  mock_gate: "zero mocking, no MagicMock or unittest.mock"
  lineage_gate: "zero leftover exemplar-lineage placeholder strings"

source_policy:
  - "pure domain core imports nothing beyond NumPy and stdlib; no infrastructure imports"
  - "bond_api confined to the goldfinger.mission adapter"

artifact_expectations:
  - "output/data/manuscript_variables.json with 25 tokens"
  - "output/figures/market_corner_trajectory.png"
  - "output/figures/vault_layered_score.png"
  - "output/figures/laser_burn_through.png"

benchmark_rubric:
  determinism: "repeated runs reproduce identical result tokens"
  honesty: "all metrics computed, none hand-authored"
  protocol_conformance: "discoverable by slug, MissionProvider lifecycle satisfied"
