# PROJECT BOND — goldfinger (Goldfinger, 1964) · mission codename GRAND SLAM
# Local-only working tree. Never push. Path-scoped commits only.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goldfinger"
version = "0.1.0"
license = {text = "MIT"}
description = "Special-Agent mission software: gold-market cornering model, vault defense assessment, laser threat physics (GRAND SLAM)."
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "bond-api",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.12",
]

# Local path dependency so the FROZEN bond-api protocol is importable.
# bond-api is Layer 1 (THE PROTOCOL); every film package codes against it.
[tool.uv.sources]
bond-api = { path = "/Users/4d/Documents/GitHub/template/projects/working/bond/bond-api" }

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src/goldfinger"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
mypy_path = ["src"]
explicit_package_bases = true
warn_return_any = true
files = ["src", "scripts"]

# bond-api is a FROZEN sibling package installed without py.typed markers.
[[tool.mypy.overrides]]
module = "bond_api.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.uv]
package = true
