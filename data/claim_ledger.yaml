# Claim ledger — goldfinger (GRAND SLAM)

# Registers sourced numeric claims for evidence-registry validation. Each
# claim points at the deterministic source that backs it; no claim is a
# hand-authored constant in prose.

claims:
  - id: "market_price_gain"
    claim: "a 30 percent supply cut at elasticity 1.25 raises price by ~33 percent"
    source: "goldfinger.market_attack.price_gain(REFERENCE_MODEL)"
    token: "MARKET_PRICE_GAIN_PCT"
  - id: "vault_composite_score"
    claim: "the reference vault scores ~0.780 (medium security), penetration ~0.009 percent"
    source: "goldfinger.vault_security.layered_security_score / penetration_probability"
    token: "VAULT_SCORE / VAULT_PENETRATION_PCT"
  - id: "laser_burn_through"
    claim: "a 5000 W beam with 0.6 absorptivity burns a 50 mm steel plate in ~0.72 s"
    source: "goldfinger.laser_physics.burn_through_time(REFERENCE_PHYSICS)"
    token: "LASER_BURN_THROUGH_S"
